{# Pedido em segundo plano: a barra desaparece ao terminar; a sincronização traz a resposta sem recarregar. #}
<div class="atividade-fixa" id="objetivo-{{ objetivo.pk }}" data-objetivo-pendente role="status" aria-live="polite"
     hx-get="{% url 'chat:objetivo' objetivo.pk %}" hx-trigger="every 3s" hx-target="this" hx-swap="outerHTML">
  {% include "chat/_mascote.html" with estado="thinking" %}
  <span class="atividade-texto">Continuando o seu pedido em segundo plano; a resposta aparece aqui.</span>
</div>

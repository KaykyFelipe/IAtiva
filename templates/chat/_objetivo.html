{# Pedido que continua em segundo plano (M38): só situação, sem dados. Recarrega a conversa quando termina. #}
<div class="atividade-fixa" id="objetivo-{{ objetivo.pk }}" role="status" aria-live="polite"
     hx-get="{% url 'chat:objetivo' objetivo.pk %}" hx-trigger="every 3s" hx-target="this" hx-swap="outerHTML">
  <span class="giro" aria-hidden="true"></span>
  <span class="atividade-texto">Continuando o seu pedido em segundo plano; a resposta aparece aqui.</span>
</div>

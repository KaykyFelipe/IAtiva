{# M134/M135: "Esta informação está correta?" no estilo do copiar: ícone, menu Sim/Não; "Não" abre a janela para a TI. #}
<span class="avaliacao{% if avaliacao %} {% if avaliacao.correta %}avaliada-sim{% else %}avaliada-nao{% endif %}{% endif %}" data-avaliacao
      data-url="{% url 'chat:avaliar' conversa.pk m.pk %}">
  <button class="icone botao-avaliar" type="button" data-avaliar aria-haspopup="menu" aria-expanded="false"
          aria-label="Esta informação está correta?"
          title="{% if not avaliacao %}Esta informação está correta?{% elif avaliacao.correta %}Você confirmou que está correta{% else %}Enviado para o T.I verificar{% endif %}">
    {% include "chat/_icone.html" with nome="avaliar" %}
  </button>
  <div class="menu-copia menu-avaliar" popover data-menu-avaliar></div>
</span>

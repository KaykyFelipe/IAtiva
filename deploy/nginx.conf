# Proxy do IAtiva (M31). Manda o tráfego para a cor ativa, definida em /etc/nginx/iativa/ativo.conf
# (escrito por scripts/implantar.sh). `nginx -s reload` troca a cor sem derrubar conexões: os processos
# antigos do nginx terminam as requisições que já estavam atendendo.
worker_processes 1;
events { worker_connections 512; }

http {
    access_log off;  # sem log de acesso: URLs podem carregar parâmetros
    error_log /dev/stderr warn;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;  # DNS interno do Docker

    include /etc/nginx/iativa/ativo.conf;  # define: upstream iativa_app { server app-<cor>:8000; }

    server {
        listen 8080;
        location / {
            proxy_pass http://iativa_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;  # o mesmo Host do navegador (CSRF e ALLOWED_HOSTS)
            proxy_set_header Connection "";
            proxy_read_timeout 600s;  # consultas longas do agente
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}

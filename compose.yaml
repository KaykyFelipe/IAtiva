# Ambiente do IAtiva no servidor — atualização sem interrupção (M31).
#
# Portas publicadas SOMENTE em 127.0.0.1 do servidor. Não altere para 0.0.0.0 nem publique na rede
# sem passar pela Etapa 9 (acesso externo).
#
# Duas cores da aplicação (azul e verde) com imagens versionadas pelo commit. O proxy manda o tráfego
# para a cor ativa; na troca, a cor antiga termina as consultas em andamento (drenagem) antes de parar.
# Quem sobe, troca, drena e reverte é scripts/implantar.sh. Migrações rodam à parte (serviço migrar).
#
# Uso direto (normalmente feito pelos scripts):
#   scripts/implantar.sh <imagem>     implanta uma imagem já construída e testada
#   scripts/implantar.sh --reverter   volta o tráfego para a versão anterior
#   scripts/implantar.sh --estado     mostra cor ativa, versões e pendências
name: ${IATIVA_PROJETO:-iativa}

x-app: &app
  restart: unless-stopped
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    IATIVA_DB_HOST: db
    IATIVA_DB_PORT: "5432"
    IATIVA_SYNTHETIC_ERP_PATH: /app/var/erp_sintetico.sqlite3
    # Exceção T6: escuta em 0.0.0.0 só dentro do container; o host só publica 127.0.0.1 (proxy).
    IATIVA_ALLOW_CONTAINER_BIND: "1"
  volumes:
    - iativa_var:/app/var
  stop_grace_period: 15m  # drenagem: consultas em andamento terminam antes de o processo sair
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude/pronto/', timeout=5)"]
    interval: 5s
    timeout: 6s
    retries: 3
    start_period: 20s
  cpus: 2.0
  mem_limit: 3g

x-worker: &worker
  restart: unless-stopped
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  environment:
    IATIVA_DB_HOST: db
    IATIVA_DB_PORT: "5432"
    IATIVA_SYNTHETIC_ERP_PATH: /app/var/erp_sintetico.sqlite3
  command: ["python", "manage.py", "executar_tarefas"]
  volumes:
    - iativa_var:/app/var
  stop_grace_period: 20m  # o worker antigo termina a tarefa que já pegou; não pega outra
  cpus: 1.0
  mem_limit: 2g

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IATIVA_DB_NAME:-iativa}
      POSTGRES_USER: ${IATIVA_DB_USER:-iativa}
      POSTGRES_PASSWORD: ${IATIVA_DB_PASSWORD:?defina IATIVA_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${IATIVA_DB_PORT_HOST:-5432}:5432"
    volumes:
      - iativa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IATIVA_PORTA:-8000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./var/implantacao/proxy:/etc/nginx/iativa:ro  # ativo.conf, escrito por scripts/implantar.sh
    cpus: 0.5
    mem_limit: 128m

  app-azul:
    <<: *app
    image: ${IATIVA_IMAGEM_AZUL:-iativa-app:latest}
  app-verde:
    <<: *app
    image: ${IATIVA_IMAGEM_VERDE:-iativa-app:latest}
  worker-azul:
    <<: *worker
    image: ${IATIVA_IMAGEM_AZUL:-iativa-app:latest}
  worker-verde:
    <<: *worker
    image: ${IATIVA_IMAGEM_VERDE:-iativa-app:latest}

  # Tarefas avulsas com a imagem NOVA, antes de ela receber tráfego (profile: ferramentas).
  migrar:
    profiles: ["ferramentas"]
    image: ${IATIVA_IMAGEM_NOVA:-iativa-app:latest}
    env_file: .env
    environment:
      IATIVA_DB_HOST: db
      IATIVA_DB_PORT: "5432"
      IATIVA_SYNTHETIC_ERP_PATH: /app/var/erp_sintetico.sqlite3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - iativa_var:/app/var
    command: ["python", "manage.py", "migrate", "--noinput"]
    cpus: 1.0
    mem_limit: 2g

volumes:
  iativa_pgdata:
  iativa_var:
